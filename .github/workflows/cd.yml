name: Despliegue Continuo (CD) - EKS

# Se activa SOLO cuando se hace push a la rama 'deploy'.
# Flujo completo: build -> push a ECR -> actualizar deployments en EKS.
on:
  push:
    branches:
      - deploy

env:
  AWS_REGION: us-east-1
  PROJECT_NAME: devops-u2
  EKS_CLUSTER_NAME: devops-u2-eks
  K8S_NAMESPACE: apps

jobs:
  build-and-deploy:
    name: Build, Push y Deploy en EKS
    runs-on: ubuntu-latest

    steps:
      # ----------------------------------------------------------
      # 1. Obtener el codigo fuente
      # ----------------------------------------------------------
      - name: Checkout del codigo
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # 2. Autenticar en AWS con credenciales almacenadas en Secrets
      #    Secrets requeridos:
      #      - AWS_ACCESS_KEY_ID
      #      - AWS_SECRET_ACCESS_KEY
      #      - AWS_SESSION_TOKEN   (requerido por AWS Academy)
      #      - AWS_ACCOUNT_ID      (numero de cuenta AWS, para construir la URL de ECR)
      # ----------------------------------------------------------
      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            ${{ env.AWS_REGION }}

      # ----------------------------------------------------------
      # 3. Login en Amazon ECR
      #    Genera un token temporal que permite hacer docker push
      #    hacia el registro privado de imagenes de AWS.
      # ----------------------------------------------------------
      - name: Login en Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ----------------------------------------------------------
      # 4. Build y Push - Backend Ventas
      # ----------------------------------------------------------
      - name: Build y Push backend ventas
        run: |
          REGISTRY="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"
          IMAGE="${REGISTRY}/${{ env.PROJECT_NAME }}-backend:latest"
          docker build --platform linux/amd64 \
            -t "$IMAGE" \
            ./back-Ventas_SpringBoot/Springboot-API-REST
          docker push "$IMAGE"

      # ----------------------------------------------------------
      # 5. Build y Push - Backend Despachos
      #    Nota: el ECR de la infra tiene un solo repo "backend".
      #    Si se desea separar, se crean dos repos en ecr.tf.
      #    Aqui usamos tags distintos dentro del mismo repo.
      # ----------------------------------------------------------
      - name: Build y Push backend despachos
        run: |
          REGISTRY="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"
          IMAGE="${REGISTRY}/${{ env.PROJECT_NAME }}-backend:despachos-latest"
          docker build --platform linux/amd64 \
            -t "$IMAGE" \
            ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
          docker push "$IMAGE"

      # ----------------------------------------------------------
      # 6. Build y Push - Frontend React/Nginx
      # ----------------------------------------------------------
      - name: Build y Push frontend
        run: |
          REGISTRY="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"
          IMAGE="${REGISTRY}/${{ env.PROJECT_NAME }}-frontend:latest"
          docker build --platform linux/amd64 \
            -t "$IMAGE" \
            ./front_despacho
          docker push "$IMAGE"

      # ----------------------------------------------------------
      # 7. Configurar kubectl para conectarse al cluster EKS
      #    Descarga y configura el kubeconfig automaticamente
      #    usando las credenciales AWS ya configuradas.
      # ----------------------------------------------------------
      - name: Configurar kubectl para EKS
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ env.EKS_CLUSTER_NAME }}

      # ----------------------------------------------------------
      # 8. Desplegar en EKS - Forzar rollout de los deployments
      #    kubectl rollout restart hace que Kubernetes descargue
      #    la imagen :latest actualizada desde ECR y reemplace
      #    los pods existentes con un RollingUpdate (sin downtime).
      # ----------------------------------------------------------
      - name: Desplegar backend en EKS
        run: |
          kubectl rollout restart deployment/${{ env.PROJECT_NAME }}-backend \
            -n ${{ env.K8S_NAMESPACE }}
          kubectl rollout status deployment/${{ env.PROJECT_NAME }}-backend \
            -n ${{ env.K8S_NAMESPACE }} \
            --timeout=120s

      - name: Desplegar frontend en EKS
        run: |
          kubectl rollout restart deployment/${{ env.PROJECT_NAME }}-frontend \
            -n ${{ env.K8S_NAMESPACE }}
          kubectl rollout status deployment/${{ env.PROJECT_NAME }}-frontend \
            -n ${{ env.K8S_NAMESPACE }} \
            --timeout=120s

      # ----------------------------------------------------------
      # 9. Verificar que los pods quedaron Running
      # ----------------------------------------------------------
      - name: Verificar estado de los pods
        run: |
          echo "=== Pods en namespace ${{ env.K8S_NAMESPACE }} ==="
          kubectl get pods -n ${{ env.K8S_NAMESPACE }}
          echo ""
          echo "=== Servicios ==="
          kubectl get services -n ${{ env.K8S_NAMESPACE }}
          echo ""
          echo "=== Ingress (URL publica del ALB) ==="
          kubectl get ingress -n ${{ env.K8S_NAMESPACE }}


          